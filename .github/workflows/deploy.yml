name: Build ERPNext SGAT v15 Image

on:
  workflow_dispatch:
  push:
    branches:
      - production-v15

permissions:
  contents: read
  packages: write

env:
  BUILDER_DIR: builder
  APPS_JSON_PATH: builder/.github/tmp/apps.json
  CACHE_SCOPE: app-image-erpnext-production-v15-v2
  TEST_IMAGE: local/erpnext:${{ github.run_id }}-${{ github.run_attempt }}
  FINAL_IMAGE: ghcr.io/sgat-itgen/erpnext-sgat:production-v15

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout frappe_docker builder
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: ${{ env.BUILDER_DIR }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create apps.json
        env:
          APPS_JSON_PATH: ${{ env.APPS_JSON_PATH }}
        run: |
          mkdir -p "$(dirname "$APPS_JSON_PATH")"
          cat > "$APPS_JSON_PATH" <<'JSON'
          [
            {
              "url": "https://github.com/sgat-itgen/ERPNext_SGAT.git",
              "branch": "production-v15"
            }
          ]
          JSON
          test -s "$APPS_JSON_PATH"

      - name: Force app definition into builder stage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("builder/images/layered/Containerfile")
          content = path.read_text()
          mount = (
              "RUN --mount=type=secret,id=apps_json,target=/opt/frappe/apps.json,uid=1000,gid=0 \\\n"
              "  : \"${CACHE_BUST}\" && \\\n"
          )
          replacement = (
              "COPY .github/tmp/apps.json /opt/frappe/apps.json\n"
              "RUN : \"${CACHE_BUST}\" && \\\n"
          )
          if mount not in content:
              raise SystemExit("Expected layered Containerfile build step was not found")
          path.write_text(content.replace(mount, replacement, 1))
          PY
          grep -n -A5 -B2 'apps.json' builder/images/layered/Containerfile

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILDER_DIR }}
          file: ${{ env.BUILDER_DIR }}/images/layered/Containerfile
          build-args: |
            FRAPPE_IMAGE_PREFIX=frappe
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-15
            CACHE_BUST=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          load: true
          platforms: linux/amd64
          secrets: |
            id=apps_json,src=${{ env.APPS_JSON_PATH }}
          tags: ${{ env.TEST_IMAGE }}

      - name: Smoke test image contents
        run: |
          docker run --rm --entrypoint bash "${TEST_IMAGE}" -lc \
            'test -d /home/frappe/frappe-bench/apps/frappe && \
             test -d /home/frappe/frappe-bench/apps/erpnext && \
             test -f /home/frappe/frappe-bench/apps/erpnext/erpnext/hooks.py'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push production image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILDER_DIR }}
          file: ${{ env.BUILDER_DIR }}/images/layered/Containerfile
          build-args: |
            FRAPPE_IMAGE_PREFIX=frappe
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-15
            CACHE_BUST=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          platforms: linux/amd64
          push: true
          secrets: |
            id=apps_json,src=${{ env.APPS_JSON_PATH }}
          tags: ${{ env.FINAL_IMAGE }}
