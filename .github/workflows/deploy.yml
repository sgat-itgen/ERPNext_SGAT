name: Build ERPNext SGAT v15 Image

on:
  workflow_dispatch:
  push:
    branches:
      - production-v15

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    uses: frappe/frappe_docker/.github/workflows/app-build-image.yml@main
    with:
      app_name: erpnext
      app_repo: sgat-itgen/ERPNext_SGAT
      app_ref: production-v15
      frappe_ref: version-15
      frappe_image_prefix: frappe
      image_name: ghcr.io/sgat-itgen/erpnext-sgat
      image_tag: production-v15
      registry: ghcr.io
      push: true
      platforms: linux/amd64
